query homeTrainingsStatusChart(
  $period: HomeTrainingsChartPeriod!
  $year: Int
  $month: Int
  $filter: DashboardSearchInput
) {
  homeTrainingsStatusChart(
    period: $period
    year: $year
    month: $month
    filter: $filter
  ) {
    period
    year
    month
    labels
    scheduled
    cancelled
    finished
    scheduledTotal
    cancelledTotal
    finishedTotal
  }
}
